name: Build Chord Follow APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-chord-follow.yml'
permissions:
  contents: write
concurrency:
  group: chord-follow-apk
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Run tests
        run: gradle testDebugUnitTest --no-daemon
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - name: Verify and prepare APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | head -n 5
          mkdir -p release
          cp "$APK" release/Chord-Follow-debug.apk
          sha256sum release/Chord-Follow-debug.apk > release/SHA256SUMS.txt
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chord-Follow-APK
          path: release/*
          retention-days: 30
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: chord-follow-${{ github.run_number }}
          name: Chord Follow APK #${{ github.run_number }}
          generate_release_notes: true
          files: |
            release/Chord-Follow-debug.apk
            release/SHA256SUMS.txt
